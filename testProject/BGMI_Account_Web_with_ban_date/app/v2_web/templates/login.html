{% extends "base.html" %}

{% block auth_content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-4">
            <div class="login-box p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-terminal" style="font-size: 3rem; color: #00ff9d;"></i>
                    <h3 class="mt-3 glow-text">BGMI::SECURE_ACCESS</h3>
                    <p class="text-muted">Authorization Required</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label terminal-text">
                            <i class="fas fa-user"></i> USERNAME
                        </label>
                        <input type="text" class="form-control cyber-input" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label terminal-text">
                            <i class="fas fa-key"></i> PASSWORD
                        </label>
                        <input type="password" class="form-control cyber-input" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-cyber w-100">
                        <i class="fas fa-unlock-alt"></i> AUTHENTICATE
                    </button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted terminal-text">
                        <i class="fas fa-shield-alt"></i> Encrypted Connection
                    </small>
                </div>
            </div>
            <div class="text-center mt-3">
                <small class="terminal-text" style="color: #00ff9d; opacity: 0.5;">
                    default: admin / admin123
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
