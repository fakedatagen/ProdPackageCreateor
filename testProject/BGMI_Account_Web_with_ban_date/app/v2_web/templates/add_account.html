{% extends "base.html" %} {% block content %}
<h2 class="glow-text mb-4">➕ ADD NEW ACCOUNT</h2>

<div class="cyber-card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label" style="color: #00ff9d;">📧 EMAIL *</label>
                    <input type="email" class="form-control cyber-input" id="email" name="email" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="platform" class="form-label" style="color: #00ff9d;">🔧 PLATFORM *</label>
                    <select class="form-control cyber-input" id="platform" name="platform" required>
                        <option value="gmail">📧 Gmail</option>
                        <option value="twitter">🐦 Twitter</option>
                        <option value="facebook">📘 Facebook</option>
                    </select>
                </div>

                <!-- BGMI User ID - Prominent Field -->
                <div class="col-12 mb-3" style="background: rgba(0, 255, 157, 0.05); padding: 15px; border-radius: 10px; border: 1px solid #00ff9d;">
                    <label for="platform_id" class="form-label" style="color: #ffaa00; font-size: 1.1rem;">
                        <i class="fas fa-key"></i> 🔑 BGMI USER ID *
                    </label>
                    <input type="text" class="form-control cyber-input" id="platform_id" name="platform_id" placeholder="Enter BGMI User ID (e.g., 55753983644)" style="font-size: 1.2rem; font-family: monospace;" required>
                    <small class="text-muted">This is the unique numeric ID from BGMI game profile - Required field</small>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="account_name" class="form-label" style="color: #00ff9d;">👤 ACCOUNT NAME</label>
                    <input type="text" class="form-control cyber-input" id="account_name" name="account_name">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="status" class="form-label" style="color: #00ff9d;">📊 STATUS</label>
                    <select class="form-control cyber-input" id="status" name="status">
                        <option value="active">✅ Active - Ready to play</option>
                        <option value="banned">🚫 Banned - Suspended</option>
                        <option value="na">💀 NA - Not created yet</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="username" class="form-label" style="color: #00ff9d;">🎮 USERNAME (IGN)</label>
                    <input type="text" class="form-control cyber-input" id="username" name="username">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="rank" class="form-label" style="color: #ffaa00;">🏆 RANK</label>
                    <select class="form-control cyber-input" id="rank" name="rank">
                        <option value="">Select Rank</option>
                        <option value="bronze">🥉 Bronze</option>
                        <option value="silver">🥈 Silver</option>
                        <option value="gold">🥇 Gold</option>
                        <option value="platinum">💎 Platinum</option>
                        <option value="diamond">🔷 Diamond</option>
                        <option value="crown">👑 Crown</option>
                        <option value="ace">🃏 Ace</option>
                        <option value="conqueror">⚔️ Conqueror</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="merit" class="form-label" style="color: #00d4ff;">⭐ MERIT SCORE</label>
                    <input type="number" class="form-control cyber-input" id="merit" name="merit" min="0" max="999" step="1" value="0" placeholder="0-999">
                    <small class="text-muted">Merit score (0-999). Higher is better.</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="ban_date" class="form-label" style="color: #ff3366;">BAN DATE / UNTIL</label>
                    <input type="text" class="form-control cyber-input" id="ban_date" name="ban_date" placeholder="e.g., 2036 or 2026-12-31">
                    <small class="text-muted">Use this when status is banned.</small>
                </div>
                <div class="col-12 mb-3">
                    <label for="comment" class="form-label" style="color: #00ff9d;">💬 COMMENT</label>
                    <textarea class="form-control cyber-input" id="comment" name="comment" rows="3"></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-cyber">➕ ADD ACCOUNT</button>
            <a href="{{ url_for('accounts') }}" class="btn btn-secondary">❌ CANCEL</a>
        </form>
    </div>
</div>
{% endblock %}
