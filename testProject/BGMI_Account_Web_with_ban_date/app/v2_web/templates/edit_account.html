{% extends "base.html" %} {% block content %}
<h2 class="glow-text mb-4">✏️ EDIT ACCOUNT #{{ account.id }}</h2>

<div class="cyber-card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label" style="color: #00ff9d;">📧 EMAIL *</label>
                    <input type="email" class="form-control cyber-input" id="email" name="email" value="{{ account.email }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="platform" class="form-label" style="color: #00ff9d;">🔧 PLATFORM *</label>
                    <select class="form-control cyber-input" id="platform" name="platform" required>
                        <option value="gmail" {% if account.platform=='gmail' %}selected{% endif %}>Gmail</option>
                        <option value="twitter" {% if account.platform=='twitter' %}selected{% endif %}>Twitter</option>
                        <option value="facebook" {% if account.platform=='facebook' %}selected{% endif %}>Facebook</option>
                    </select>
                </div>

                <!-- BGMI User ID - Prominent Field -->
                <div class="col-12 mb-3" style="background: rgba(0, 255, 157, 0.05); padding: 15px; border-radius: 10px; border: 1px solid #00ff9d;">
                    <label for="platform_id" class="form-label" style="color: #ffaa00; font-size: 1.1rem;">
                        <i class="fas fa-key"></i> 🔑 BGMI USER ID (IMPORTANT)
                    </label>
                    <input type="text" class="form-control cyber-input" id="platform_id" name="platform_id" value="{{ account.platform_id }}" placeholder="Enter BGMI User ID (e.g., 55753983644)" style="font-size: 1.2rem; font-family: monospace;">
                    <small class="text-muted">This is the unique numeric ID from BGMI game profile</small>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="account_name" class="form-label" style="color: #00ff9d;">👤 ACCOUNT NAME</label>
                    <input type="text" class="form-control cyber-input" id="account_name" name="account_name" value="{{ account.account_name }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="status" class="form-label" style="color: #00ff9d;">📊 STATUS</label>
                    <select class="form-control cyber-input" id="status" name="status">
                        <option value="active" {% if account.status=='active' %}selected{% endif %}>✅ Active - Ready to play</option>
                        <option value="banned" {% if account.status=='banned' %}selected{% endif %}>🚫 Banned - Suspended</option>
                        <option value="na" {% if account.status=='na' %}selected{% endif %}>💀 NA - Not created yet</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="username" class="form-label" style="color: #00ff9d;">🎮 USERNAME (IGN)</label>
                    <input type="text" class="form-control cyber-input" id="username" name="username" value="{{ account.username }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="rank" class="form-label" style="color: #ffaa00;">🏆 RANK</label>
                    <select class="form-control cyber-input" id="rank" name="rank">
                        <option value="">Select Rank</option>
                        <option value="bronze" {% if account.rank=='bronze' %}selected{% endif %}>🥉 Bronze</option>
                        <option value="silver" {% if account.rank=='silver' %}selected{% endif %}>🥈 Silver</option>
                        <option value="gold" {% if account.rank=='gold' %}selected{% endif %}>🥇 Gold</option>
                        <option value="platinum" {% if account.rank=='platinum' %}selected{% endif %}>💎 Platinum</option>
                        <option value="diamond" {% if account.rank=='diamond' %}selected{% endif %}>🔷 Diamond</option>
                        <option value="crown" {% if account.rank=='crown' %}selected{% endif %}>👑 Crown</option>
                        <option value="ace" {% if account.rank=='ace' %}selected{% endif %}>🃏 Ace</option>
                        <option value="conqueror" {% if account.rank=='conqueror' %}selected{% endif %}>⚔️ Conqueror</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="merit" class="form-label" style="color: #00d4ff;">⭐ MERIT SCORE</label>
                    <input type="number" class="form-control cyber-input" id="merit" name="merit" min="0" max="999" step="1" value="{{ account.merit or 0 }}" placeholder="0-999">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="ban_date" class="form-label" style="color: #ff3366;">BAN DATE / UNTIL</label>
                    <input type="text" class="form-control cyber-input" id="ban_date" name="ban_date" value="{{ account.ban_date or '' }}" placeholder="e.g., 2036 or 2026-12-31">
                </div>
                <div class="col-12 mb-3">
                    <label for="comment" class="form-label" style="color: #00ff9d;">💬 COMMENT</label>
                    <textarea class="form-control cyber-input" id="comment" name="comment" rows="3">{{ account.comment }}</textarea>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-cyber">💾 SAVE CHANGES</button>
                <a href="{{ url_for('view_account', account_id=account.id) }}" class="btn btn-secondary">❌ CANCEL</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
